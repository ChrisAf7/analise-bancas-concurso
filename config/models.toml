# Avaliadores de IA (ADR-012). Só planos gratuitos.
# Os modelos gratuitos mudam com frequência: o ID exato usado em cada execução fica em annotation_run.
# Trocar um modelo aqui exige rodar de novo o corpus inteiro daquela variável (nunca misturar modelos numa série).
#
# rpm = teto de requisições por minuto que o cliente respeita (abaixo do limite do provedor, por segurança).
# daily_limit = teto diário conhecido do plano gratuito (0 = desconhecido; o provedor informa via 429).

[raters.A]
provider = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
api_key_env = "GEMINI_API_KEY"
model = "gemini-3.5-flash"
rpm = 8
daily_limit = 0
json_mode = true

[raters.B]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
rpm = 12
daily_limit = 50
json_mode = true

# Reserva para B, de outra família, caso o modelo principal saia do plano gratuito.
[raters.B_reserva]
provider = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "baidu/ernie-5.5-flash-preview:free"
rpm = 12
daily_limit = 50
json_mode = true
